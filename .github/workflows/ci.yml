name: 校验人格卡

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: 结构校验（严格模式）
        run: python tools/validate.py --strict

      - name: 构建 dist
        run: python tools/build.py

      - name: 检查构建产物非空
        run: |
          test -s dist/index.json
          test -s dist/INDEX.md
          ls dist/prompts/*.md > /dev/null

      - name: 检查产物确定性（同输入两次构建必须字节一致）
        run: |
          cp -r dist /tmp/dist-first
          python tools/build.py --quiet
          diff -r /tmp/dist-first dist
        shell: bash
