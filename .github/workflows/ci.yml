name: 校验人格卡

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: 结构校验（严格模式）
        run: python tools/validate.py --strict

      - name: 构建 dist
        run: python tools/build.py

      - name: 检查构建产物非空
        run: |
          test -s dist/index.json
          test -s dist/INDEX.md
          ls dist/prompts/*.md > /dev/null

      - name: 导出酒馆卡
        run: python tools/export_tavern.py

      - name: 检查酒馆卡是合法 V2
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          spec = json.loads(pathlib.Path("schema/persona.schema.json").read_text(encoding="utf-8"))
          need = {"name", "description", "personality", "scenario", "first_mes", "mes_example",
                  "creator_notes", "system_prompt", "post_history_instructions",
                  "alternate_greetings", "tags", "creator", "character_version", "extensions"}
          bad = []
          files = sorted(pathlib.Path("dist/tavern").glob("*.json"))
          if not files:
              bad.append("dist/tavern 里一张卡都没有")
          for f in files:
              d = json.loads(f.read_text(encoding="utf-8"))
              if d.get("spec") != "chara_card_v2" or d.get("spec_version") != "2.0":
                  bad.append(f"{f.name}: spec 不对")
              miss = need - set(d.get("data", {}))
              if miss:
                  bad.append(f"{f.name}: 缺字段 {sorted(miss)}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"酒馆卡 {len(files)} 张，全部满足 V2 必填字段")
          EOF

      - name: 检查产物确定性（同输入两次构建必须字节一致）
        run: |
          cp -r dist /tmp/dist-first
          python tools/build.py --quiet
          python tools/export_tavern.py --quiet
          diff -r /tmp/dist-first dist
        shell: bash
