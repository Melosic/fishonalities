name: 校验人格卡

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: 结构校验（严格模式）
        run: python tools/validate.py --strict

      - name: 构建 dist
        run: python tools/build.py

      - name: 检查构建产物非空
        run: |
          test -s dist/index.json
          test -s dist/INDEX.md
          ls dist/prompts/*.md > /dev/null

      - name: 导出酒馆卡
        run: python tools/export_tavern.py

      - name: 检查酒馆卡是合法 V2
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          spec = json.loads(pathlib.Path("schema/persona.schema.json").read_text(encoding="utf-8"))
          need = {"name", "description", "personality", "scenario", "first_mes", "mes_example",
                  "creator_notes", "system_prompt", "post_history_instructions",
                  "alternate_greetings", "tags", "creator", "character_version", "extensions"}
          bad = []
          files = sorted(pathlib.Path("dist/tavern").glob("*.json"))
          if not files:
              bad.append("dist/tavern 里一张卡都没有")
          for f in files:
              d = json.loads(f.read_text(encoding="utf-8"))
              if d.get("spec") != "chara_card_v2" or d.get("spec_version") != "2.0":
                  bad.append(f"{f.name}: spec 不对")
              miss = need - set(d.get("data", {}))
              if miss:
                  bad.append(f"{f.name}: 缺字段 {sorted(miss)}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"酒馆卡 {len(files)} 张，全部满足 V2 必填字段")
          EOF

      - name: 体检（信号占比 / 卡间相似度 / 卡内自检，不联网）
        run: python tools/audit.py

      - name: 静态检查（不联网、不需要 key）
        run: python tools/probe.py static

      - name: 判据自测（不联网、不需要 key）
        run: python tests/test_smoke_judge.py

      - name: 记忆层能跑（不联网、不需要 key）
        run: python examples/memory.py

      - name: 机器人样板能跑（不联网、不需要 key）
        run: |
          python examples/simple_bot.py --help > /dev/null
          # 无 key 时不该崩在这里，而是把卡读进来、等输入
          printf '/quit\n' | python examples/simple_bot.py xiao-geng --private --no-delay
          printf '/quit\n' | python examples/simple_bot.py gou-dan --group --no-delay
          # 群聊卡读到 channel=group，私聊卡读到 channel=private
          python - <<'EOF'
          import json, pathlib, sys
          index = json.loads(pathlib.Path("dist/index.json").read_text(encoding="utf-8"))
          ch = {p["id"]: p["channel"] for p in index["personas"]}
          if ch.get("gou-dan") != "group" or ch.get("xiao-geng") != "private":
              print(f"channel 读错了：{ch.get('gou-dan')} / {ch.get('xiao-geng')}"); sys.exit(1)
          print("样板读得到 channel 字段")
          EOF

      - name: 打包开箱文件夹
        run: |
          python tools/pack.py --out /tmp/pack
          python - <<'EOF'
          import pathlib, sys
          base = pathlib.Path("/tmp/pack")
          md = sorted(base.rglob("*.md"))
          prompts = [p for p in md if p.name != "先看这个.md"]
          readme = base / "先看这个.md"
          if not readme.is_file():
              print("缺 先看这个.md"); sys.exit(1)
          if len(prompts) != 21:
              print(f"应生成 21 份 prompt，实际 {len(prompts)}"); sys.exit(1)
          # 文件名不该还是英文 id：至少一大半得带中文
          cn = sum(1 for p in prompts if any("\u4e00" <= c <= "\u9fff" for c in p.name))
          if cn < len(prompts):
              print(f"有 {len(prompts)-cn} 个文件名还是英文 id"); sys.exit(1)
          print(f"开箱包 {len(prompts)} 份 prompt，文件名全是中文")
          EOF

      - name: 探针脚本能跑（不打真 API，只确认可执行）
        run: |
          python tools/probe.py --help > /dev/null
          python - <<'EOF'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("probe", "tools/probe.py")
          assert spec is not None and spec.loader is not None
          print("probe.py 可导入")
          EOF

      - name: 检查产物确定性（同输入两次构建必须字节一致）
        run: |
          cp -r dist /tmp/dist-first
          python tools/build.py --quiet
          python tools/export_tavern.py --quiet
          diff -r /tmp/dist-first dist
        shell: bash
